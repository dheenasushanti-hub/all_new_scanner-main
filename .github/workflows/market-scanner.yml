name: NIFTY scanner v126 (3-minute Cloudflare dispatch)

# NO GitHub cron: keep the existing Cloudflare Worker and its 3-minute cadence.
# Supports workflow_dispatch (the previous integration) plus optional repository_dispatch.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "scan, or an EXPLICIT manual state operation after broker/mailbox verification"
        type: choice
        required: true
        default: scan
        options: [scan, initialize_flat, migrate_state, reconcile_flat, requeue_alert]
      source_state:
        description: "Existing repo state path for migrate_state (only when destination absent)"
        type: string
        required: false
      position_id:
        description: "For reconcile_flat: exact open reference ID; broker position must be checked first"
        type: string
        required: false
      alert_id:
        description: "For requeue_alert: exact event ID; mailbox non-delivery must be verified"
        type: string
        required: false
  repository_dispatch:
    types: [nifty-market-scan]

permissions:
  contents: write

concurrency:
  group: nifty-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    env:
      STATE_FILE: state/market_state_v120_3.json
      AUDIT_DIR: audit
      NIFTY_SCANNER_CONFIG: ${{ vars.NIFTY_SCANNER_CONFIG }}
      NOTIFICATION_CLAIM_TOKEN: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Checkout default branch (required for state consistency)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify runner is at the default branch
        id: runner_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$DEFAULT_BRANCH"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify the scanner release and compile the runtime
        id: release_check
        shell: bash
        run: |
          set -euo pipefail
          test "$(python market_scanner.py --version)" = "126.0.0"
          python -m py_compile market_scanner.py

      - name: Initialize only after manual verified flat-state selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'initialize_flat' }}
        env:
          MANUAL_FLAT_CONFIRMED: '1'
        run: python market_scanner.py --initialize-flat

      - name: Non-destructive migration (destination must not exist)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'migrate_state' }}
        env:
          SOURCE_STATE: ${{ inputs.source_state }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_STATE"
          python market_scanner.py --migrate-state "$SOURCE_STATE"

      - name: Operator-verified reference lock reconciliation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile_flat' }}
        env:
          MANUAL_FLAT_CONFIRMED: '1'
          POSITION_ID: ${{ inputs.position_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSITION_ID"
          python market_scanner.py --reconcile-flat "$POSITION_ID"

      - name: Operator-verified alert requeue (never automatic for uncertain SMTP)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'requeue_alert' }}
        env:
          MANUAL_ALERT_UNDELIVERED_CONFIRMED: '1'
          ALERT_ID: ${{ inputs.alert_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ALERT_ID"
          python market_scanner.py --requeue-alert "$ALERT_ID"

      - name: One causal scan, persist all completed 1m evidence, claim actionable alerts
        id: scan_run
        if: ${{ github.event_name == 'repository_dispatch' || inputs.operation == 'scan' }}
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python market_scanner.py --scan-and-claim

      # PHASE 1: commit/push evidence and claims before even considering SMTP.
      - name: Persist state, journal, and recordings (fail closed on concurrent writes)
        id: persist_scan
        if: ${{ always() && steps.runner_branch.outcome == 'success' && steps.release_check.outcome == 'success' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f "$STATE_FILE" ]]; then git add -f -- "$STATE_FILE"; fi
          shopt -s nullglob
          audits=(audit/market_scan_v126_*.jsonl)
          if (( ${#audits[@]} )); then git add -f -- "${audits[@]}"; fi
          if [[ -d audit/inputs_v126 ]]; then git add -f -- audit/inputs_v126; fi
          if ! git diff --cached --quiet; then
            git fetch origin "$DEFAULT_BRANCH"
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
              echo 'Concurrent branch update: refusing rebase of authoritative trading state' >&2
              exit 1
            }
            git commit -m 'Persist v126 market evidence, position state and email claims'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      # PHASE 2: mark any claims DELIVERY_UNCERTAIN and COMMIT that to remote
      # BEFORE the first SMTP socket. A crash cannot create automatic duplicate mail.
      - name: Arm actionable email events, without connecting to SMTP
        id: arm
        if: ${{ always() && steps.persist_scan.outcome == 'success' && (github.event_name == 'repository_dispatch' || inputs.operation == 'scan') }}
        run: python market_scanner.py --arm-delivery

      - name: Persist armed SMTP uncertainty BEFORE sending
        id: persist_arm
        if: ${{ always() && steps.arm.outcome == 'success' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -f -- "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git fetch origin "$DEFAULT_BRANCH"
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || exit 1
            git commit -m 'Arm v126 SMTP events durably before network I/O'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Deliver ONLY durably armed actionable events
        id: deliver
        if: ${{ always() && steps.persist_arm.outcome == 'success' }}
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
        run: python market_scanner.py --deliver-armed

      # PHASE 3: save SENT/UNCERTAIN outcome; uncertain items require an explicit
      # mailbox review, not silent automatic retransmission.
      - name: Persist SMTP outcomes even after delivery failure
        if: ${{ always() && steps.persist_arm.outcome == 'success' && steps.deliver.outcome != 'skipped' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -f -- "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git fetch origin "$DEFAULT_BRANCH"
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || exit 1
            git commit -m 'Persist v126 SMTP accepted/uncertain outcomes'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
